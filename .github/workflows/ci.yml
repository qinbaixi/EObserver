name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and test (OTP 26)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '26.2'
          rebar3-version: '3.24'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build frontend (type check + bundle)
        run: make web

      - name: Unit tests
        run: rebar3 eunit

      - name: Integration tests
        run: rebar3 ct

      - name: Release
        run: rebar3 release

      - name: Release smoke test
        run: node scripts/release-smoke.mjs _build/default/rel/eobserver

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ct-logs
          path: _build/test/logs

  agent:
    # The agent runs inside observed nodes, so it must compile and work on
    # every supported release, not just the one EObserver is built with.
    name: Agent on OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    container: erlang:${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        otp: ['22', '23', '24', '25', '26', '27']
    steps:
      - uses: actions/checkout@v4
      - name: Compile and smoke test
        run: |
          mkdir -p out
          erlc -o out apps/eobserver_agent/src/eobs_agent.erl scripts/agent_smoke.erl
          erl -noshell -pa out -s agent_smoke run

  desktop:
    name: Desktop app sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Install and check
        working-directory: electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          npm ci
          node --check main.js
