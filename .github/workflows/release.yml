name: Release

# Pushing a tag such as v0.0.1 builds the release archives and desktop
# apps for Linux, macOS and Windows and publishes them as a GitHub
# Release. A manual run on main with "publish" checked does the same,
# creating the tag v<app version> on the commit it ran on. Pull requests
# that touch packaging, and other manual runs, build without publishing.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - electron/**
      - scripts/**
      - rebar.config
      - config/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release tagged v<app version>
        type: boolean
        default: false

permissions:
  contents: read

env:
  OTP_VERSION: '26.2.5.5'
  REBAR3_VERSION: '3.24.0'
  NODE_VERSION: '22'

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.vsn.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: vsn
        name: Tag matches the application version
        run: |
          vsn=$(sed -n 's/.*{vsn, "\(.*\)"}.*/\1/p' apps/eobserver/src/eobserver.app.src)
          echo "version=$vsn" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$vsn" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match app version $vsn"
            exit 1
          fi
          grep -q "\"version\": \"$vsn\"" electron/package.json || { echo "::error::electron/package.json is not $vsn"; exit 1; }

  agents:
    # Precompiled agents for releases older than the one EObserver runs on;
    # newer releases load the agent EObserver itself was built with.
    name: Agent for OTP ${{ matrix.otp }}
    runs-on: ubuntu-24.04
    container: erlang:${{ matrix.otp }}
    strategy:
      matrix:
        otp: ['22', '23', '24', '25']
    steps:
      - uses: actions/checkout@v4
      - name: Compile and smoke test
        run: |
          rel=$(erl -noshell -eval 'io:format("~s", [erlang:system_info(otp_release)]), halt().')
          mkdir -p "agent/$rel" smoke
          erlc -o "agent/$rel" apps/eobserver_agent/src/eobs_agent.erl
          erlc -o smoke scripts/agent_smoke.erl
          erl -noshell -pa "agent/$rel" smoke -s agent_smoke run
      - uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.otp }}
          path: agent/

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web
      - uses: actions/upload-artifact@v4
        with:
          name: www
          path: apps/eobserver/priv/www/

  package:
    name: Package (${{ matrix.name }})
    needs: [check-version, agents, web]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            electron: --linux AppImage tar.gz --x64
          - name: macos-arm64
            os: macos-14
            electron: --mac dmg zip --arm64
          - name: windows-x64
            os: windows-2022
            electron: --win nsis zip --x64
    env:
      VERSION: ${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: www
          path: apps/eobserver/priv/www
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-*
          merge-multiple: true
          path: apps/eobserver/priv/agent

      # Linux and Windows: prebuilt OTP. Windows builds link OpenSSL
      # statically; the Linux build needs libssl 3 on the user's system.
      - uses: erlef/setup-beam@v1
        if: runner.os != 'macOS'
        with:
          otp-version: ${{ env.OTP_VERSION }}
          rebar3-version: ${{ env.REBAR3_VERSION }}

      # macOS: setup-beam has no macOS builds, and Homebrew's Erlang links
      # Homebrew's OpenSSL, which users may not have. Build OTP with OpenSSL
      # linked statically so the bundled runtime is self-contained.
      - name: Cache OTP (macOS)
        if: runner.os == 'macOS'
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: ~/otp
          key: otp-${{ env.OTP_VERSION }}-${{ matrix.os }}-static-ssl
      - name: Build OTP (macOS)
        if: runner.os == 'macOS' && steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          brew install openssl@3
          curl -fsSL -o otp.tar.gz "https://github.com/erlang/otp/releases/download/OTP-$OTP_VERSION/otp_src_$OTP_VERSION.tar.gz"
          tar xzf otp.tar.gz
          cd "otp_src_$OTP_VERSION"
          ./configure --prefix="$HOME/otp" --with-ssl="$(brew --prefix openssl@3)" \
            --disable-dynamic-ssl-lib --without-javac --without-wx --without-odbc \
            --without-debugger --without-observer --without-et --without-megaco
          make -j"$(sysctl -n hw.ncpu)"
          make install
      - name: Set up OTP and rebar3 (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "$HOME/otp/bin" >> "$GITHUB_PATH"
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/rebar3" "https://github.com/erlang/rebar3/releases/download/$REBAR3_VERSION/rebar3"
          chmod +x "$HOME/bin/rebar3"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: electron/package-lock.json

      - name: Build release
        run: rebar3 release
      # relx writes erl.ini files with this runner's absolute paths. erl.exe
      # finds its installation by itself when there is none, so drop them;
      # otherwise the release only starts where it was built.
      - name: Remove erl.ini (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          find _build/default/rel/eobserver -name erl.ini -print -delete

      - name: Release smoke test
        run: node scripts/release-smoke.mjs _build/default/rel/eobserver

      - name: Archive release (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p out
          tar -C _build/default/rel -czf "out/eobserver-cli-$VERSION-${{ matrix.name }}.tar.gz" eobserver
      - name: Archive release (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Compress-Archive -Path _build/default/rel/eobserver -DestinationPath "out/eobserver-cli-$env:VERSION-${{ matrix.name }}.zip"

      - name: Build desktop app
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm ci
          npx electron-builder --publish never ${{ matrix.electron }}

      - name: Collect artifacts
        shell: bash
        run: |
          shopt -s nullglob
          for f in electron/dist/*.{AppImage,tar.gz,dmg,zip,exe}; do cp "$f" out/; done
          ls -la out

      # Every package is tested the way a user runs it: unpacked or installed
      # somewhere other than the build directory, under a path with a space,
      # with the files made read-only.
      - name: Test packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          T="$RUNNER_TEMP/smoke dir"
          mkdir -p "$T/cli" "$T/tar" "$T/appimage"
          tar -C "$T/cli" -xzf "out/eobserver-cli-$VERSION-linux-x64.tar.gz"
          tar -C "$T/tar" -xzf "out/EObserver-$VERSION-linux-x64.tar.gz"
          cp "out/EObserver-$VERSION-linux-x86_64.AppImage" "$T/appimage/"
          chmod +x "$T"/appimage/*.AppImage
          chmod -R a-w "$T"
          node scripts/release-smoke.mjs "$T/cli/eobserver"
          xvfb-run -a node scripts/desktop-smoke.mjs "$(find "$T/tar" -name eobserver-desktop -type f)" --no-sandbox
          # The runner has no FUSE; the AppImage runtime then unpacks itself to /tmp.
          APPIMAGE_EXTRACT_AND_RUN=1 xvfb-run -a node scripts/desktop-smoke.mjs \
            "$(echo "$T"/appimage/*.AppImage)" --no-sandbox > "$RUNNER_TEMP/appimage.log" 2>&1 \
            || { cat "$RUNNER_TEMP/appimage.log"; exit 1; }
          grep -v '^/tmp/appimage_extracted' "$RUNNER_TEMP/appimage.log"
      - name: Test packages (macOS)
        if: runner.os == 'macOS'
        run: |
          T="$RUNNER_TEMP/smoke dir"
          mkdir -p "$T/cli" "$T/dmg" "$T/zip"
          tar -C "$T/cli" -xzf "out/eobserver-cli-$VERSION-macos-arm64.tar.gz"
          hdiutil attach -nobrowse -mountpoint "$T/mnt" "out/EObserver-$VERSION-mac-arm64.dmg"
          cp -R "$T/mnt/EObserver.app" "$T/dmg/"
          hdiutil detach "$T/mnt"
          ditto -x -k "out/EObserver-$VERSION-mac-arm64.zip" "$T/zip"
          chmod -R a-w "$T"
          node scripts/release-smoke.mjs "$T/cli/eobserver"
          node scripts/desktop-smoke.mjs "$T/dmg/EObserver.app/Contents/MacOS/EObserver"
          node scripts/desktop-smoke.mjs "$T/zip/EObserver.app/Contents/MacOS/EObserver"
      - name: Test packages (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Hide the build output, so nothing can quietly start from there.
          Rename-Item _build/default/rel/eobserver eobserver.hidden
          $T = Join-Path $env:RUNNER_TEMP 'smoke dir'
          Expand-Archive "out/eobserver-cli-$env:VERSION-windows-x64.zip" "$T/cli"
          Expand-Archive "out/EObserver-$env:VERSION-win-x64.zip" "$T/zip"
          # The installer as a user runs it, into Program Files.
          $inst = 'C:\Program Files\EObserver Smoke'
          # /allusers: an elevated per-user install hands off to an unelevated
          # copy of itself, which has no desktop session to run in on CI.
          $p = Start-Process -Wait -PassThru -FilePath (Resolve-Path "out/EObserver-$env:VERSION-win-x64.exe") -ArgumentList '/S', '/allusers', "/D=$inst"
          "installer exit code: $($p.ExitCode)"
          # The installer may hand off to a second process; wait until it
          # has written the uninstaller, its last file.
          $instExe = "$inst\EObserver.exe"
          $done = "$inst\Uninstall EObserver.exe"
          for ($i = 0; $i -lt 90 -and -not (Test-Path $done); $i++) { Start-Sleep 2 }
          if (-not (Test-Path $instExe)) {
            foreach ($d in @($inst, "$env:LOCALAPPDATA\Programs", $env:ProgramFiles)) {
              "--- $d"; Get-ChildItem $d -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
            }
            Get-ChildItem 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall', 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' -ErrorAction SilentlyContinue |
              Get-ItemProperty | Where-Object DisplayName -like 'EObserver*' | Format-List DisplayName, InstallLocation
            throw "installer did not put EObserver.exe in $inst"
          }
          Start-Sleep 3
          foreach ($d in @($T, $inst)) {
            # Deny writes for Everyone, as for a normal user in Program Files.
            # Not the W shorthand: it includes SYNCHRONIZE and READ_CONTROL,
            # which would stop programs from starting at all. Inheritance
            # carries the entry to everything below.
            icacls $d /deny '*S-1-1-0:(OI)(CI)(WD,AD,WEA,WA)' /Q
            if ($LASTEXITCODE) { exit 1 }
          }
          node scripts/release-smoke.mjs "$T/cli/eobserver"
          if ($LASTEXITCODE) { exit 1 }
          $zipExe = (Get-ChildItem "$T/zip" -Recurse -Filter EObserver.exe | Select-Object -First 1).FullName
          node scripts/desktop-smoke.mjs $zipExe
          if ($LASTEXITCODE) { exit 1 }
          node scripts/desktop-smoke.mjs $instExe
          if ($LASTEXITCODE) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [check-version, package]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: v${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          cat docs/release-downloads.md >> notes.md
          cat notes.md
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # On a manual run the tag does not exist yet; gh creates it on the
        # commit this run built. Assets go up one by one into a draft, so a
        # failed upload can be retried without gh deleting the whole release,
        # and the release only becomes public once every file is there.
        run: |
          # Asset names are case-insensitive on GitHub; refuse clashes early.
          dupes=$(ls dist | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::duplicate asset names: $dupes"; exit 1; fi
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "EObserver $TAG" --notes-file notes.md
          fi
          for f in dist/*; do
            for i in 1 2 3 4 5; do
              gh release upload "$TAG" "$f" --clobber && break
              [ "$i" = 5 ] && exit 1
              echo "upload of $f failed, retrying"; sleep $((i * 5))
            done
          done
          gh release edit "$TAG" --draft=false --latest
