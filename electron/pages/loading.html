<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>EObserver</title>
<style>
  :root { color-scheme: light dark; --bg: #E8EBEF; --fg: rgba(0,0,0,.75); --accent: #a90533; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1C1E23; --fg: rgba(255,255,255,.8); --accent: #f0587a; } }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; align-items: center;
         justify-content: center; gap: 18px; background: var(--bg); color: var(--fg);
         font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  .spinner { width: 28px; height: 28px; border: 3px solid color-mix(in srgb, var(--accent) 25%, transparent);
             border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="spinner"></div>
  <div>正在启动 EObserver…</div>
</body>
</html>
