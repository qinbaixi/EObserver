<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'">
<title>EObserver</title>
<style>
  :root { color-scheme: light dark; --bg: #E8EBEF; --fg: rgba(0,0,0,.8); --muted: rgba(0,0,0,.55); --panel: #F7F8FA; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1C1E23; --fg: rgba(255,255,255,.85); --muted: rgba(255,255,255,.5); --panel: #26292F; } }
  body { margin: 0; padding: 48px 16px; background: var(--bg); color: var(--fg);
         font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: var(--muted); }
  pre { background: var(--panel); padding: 12px; border-radius: 8px; overflow: auto; max-height: 50vh;
        font: 12px ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>{{title}}</h1>
  <p>{{message}}</p>
  <pre>{{log}}</pre>
  <p>{{report}}</p>
</main>
</body>
</html>
